server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name 47.243.79.140;

	root /var/www/hot-acme;

	location ^~ /.well-known/acme-challenge/ {
		try_files $uri =404;
	}

	location / {
		return 301 https://47.243.79.140$request_uri;
	}
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name 47.243.79.140;

	ssl_certificate /etc/letsencrypt/live/47.243.79.140/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/47.243.79.140/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:hot_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	root /srv/arcade-hub/hot;
	autoindex off;
	etag on;
	disable_symlinks on;

	add_header X-Content-Type-Options nosniff always;

	location = /.hot-health {
		default_type text/plain;
		add_header Cache-Control "no-store" always;
		return 200 "ok\n";
	}

	location ~ ^/(test|prod)/latest/[A-Za-z0-9._/-]+\.json$ {
		limit_except GET {
			deny all;
		}
		default_type application/json;
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}

	location ~ ^/(test|prod)/releases/ {
		limit_except GET {
			deny all;
		}
		default_type application/octet-stream;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
